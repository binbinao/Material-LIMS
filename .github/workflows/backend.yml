name: backend

on:
  push:
    branches: [main]
    paths:
      - 'lims-common/**'
      - 'lims-model/**'
      - 'lims-dao/**'
      - 'lims-workflow/**'
      - 'lims-service/**'
      - 'lims-admin/**'
      - 'lims-web/**'
      - 'pom.xml'
      - 'lims-*/pom.xml'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lims-common/**'
      - 'lims-model/**'
      - 'lims-dao/**'
      - 'lims-workflow/**'
      - 'lims-service/**'
      - 'lims-admin/**'
      - 'lims-web/**'
      - 'pom.xml'
      - 'lims-*/pom.xml'
      - '.github/workflows/backend.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Run unit tests
        run: ./mvnw -B test
      - name: Build (skip tests)
        run: ./mvnw -B -DskipTests package