# Prometheus 监控配置 - Material LIMS

global:
  scrape_interval: 15s
  evaluation_interval: 15s

# 告警规则文件
rule_files:
  - "alert_rules.yml"

# 抓取配置
scrape_configs:
  # Prometheus自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node Exporter - 主机监控
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Spring Boot应用监控
  - job_name: 'lims-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['lims-backend:8080']
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL监控 — 需要 postgres_exporter sidecar
  # Issue #89: 之前直接抓取 postgres:5432/metrics，但 PostgreSQL
  # 本身不暴露 /metrics 端点。需要部署 postgres_exporter 并监听 9187。
  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis监控 — 需要 redis_exporter sidecar
  # Issue #89: 之前直接抓取 redis:6379/metrics，但 Redis 本身
  # 不暴露 /metrics 端点。需要部署 redis_exporter 并监听 9121。
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

# 远程写入/读取已移除：
# Issue #89: 之前将 remote_write/remote_read 指向 Alertmanager API，
# 但 Alertmanager 不是 Prometheus remote storage，这会导致持续的错误请求。
# 如需长期存储，请配置 Thanos、Cortex 或 Mimir 的地址。
