services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: lims
      POSTGRES_USER: lims
      POSTGRES_PASSWORD: lims_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema is owned by Flyway (db/migration/V*.sql). The init.sql seed is
      # disabled here so the docker-entrypoint does not pre-create rows —
      # Flyway needs an empty schema to apply V1__init.sql + V2__seed_dev.sql
      # without duplicate-key errors.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lims"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  lims-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # prod is the safe default. Issue #1: switching to dev here activates
      # the dev permit-all filter chain and DevAuthFilter's synthetic ADMIN
      # principal in any deployment that uses this compose file unchanged.
      # Local developers should override with `SPRING_PROFILES_ACTIVE=dev` in
      # their own override file, not in the shared compose.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/lims
      SPRING_DATASOURCE_USERNAME: lims
      SPRING_DATASOURCE_PASSWORD: lims_dev_password
      SPRING_DATA_REDIS_HOST: redis
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  lims-frontend:
    build:
      context: ./lims-web-ui
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    depends_on:
      - lims-backend

volumes:
  pgdata:
  minio_data:
  redis_data:
